<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atelier Under Curation | Pierza Studio</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,700&family=Manrope:wght@400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
    <script src="https://unpkg.com/lucide@0.262.0"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/utility-pages.css">
    <link rel="stylesheet" href="../css/coming-soon-v2.css">
</head>
<body class="coming-soon-v2">
    <!-- Overlay Mesh (Subtle) -->
    <div class="mesh-gradient" style="opacity: 0.2;">
        <div class="mesh-orb orb-1"></div>
        <div class="mesh-orb orb-2"></div>
    </div>

    <header class="util-header">
        <div class="header-top-row">
            <a href="../index.html" class="back-home">
                <i data-lucide="arrow-left"></i> <span>Home</span>
            </a>
            <div class="header-actions">
                <button class="theme-toggle" id="theme-toggle" title="Toggle Theme">
                    <i data-lucide="moon"></i>
                </button>
                <button class="rtl-toggle" id="rtl-toggle">RTL</button>
            </div>
        </div>
        <div class="header-logo-row">
            <a href="../index.html" class="logo">
                <svg viewBox="0 0 100 100" class="studio-logo">
                    <path d="M50 10 L50 90 M42 30 Q50 15 58 30 M45 80 L50 92 L55 80" fill="none" stroke="currentColor"/>
                    <circle cx="50" cy="10" r="3" fill="currentColor"/>
                    <path d="M35 50 Q50 35 65 50" opacity="0.6" fill="none" stroke="currentColor"/>
                </svg>
                PIERZA<span>STUDIO</span>
            </a>
        </div>
    </header>

    <main class="cs-content-wrapper">
        <div class="cs-left">
            <div class="cs-timer-row">
                <div class="timer-unit">
                    <span class="val" id="days">54</span>
                    <span class="lbl">Days</span>
                </div>
                <div class="timer-unit">
                    <span class="val" id="hours">08</span>
                    <span class="lbl">Hours</span>
                </div>
                <div class="timer-unit">
                    <span class="val" id="mins">32</span>
                    <span class="lbl">Min</span>
                </div>
                <div class="timer-unit">
                    <span class="val" id="secs">02</span>
                    <span class="lbl">Sec</span>
                </div>
            </div>

            <div class="cs-welcome">
                <h2>Welcome to the Atelier</h2>
                <p>
                    We are currently fine-tuning our next anatomical sequence. 
                    The studio is almost ready to unveil its newest curation experience.
                </p>
            </div>

            <!-- Alignment Status Bar -->
            <div class="status-wrapper">
                <div class="status-info">
                    <span>Alignment Status</span>
                    <span>88%</span>
                </div>
                <div class="status-bar">
                    <div class="status-fill"></div>
                </div>
            </div>

            <!-- Waitlist Form -->
            <div class="waitlist-group">
                <form class="waitlist-form" action="#" method="POST">
                    <input type="email" placeholder="Your email address" required>
                    <button type="submit" class="waitlist-btn">Join Waitlist</button>
                </form>
                <p class="waitlist-note">We'll notify you when the studio is ready.</p>
            </div>
        </div>

        <div class="cs-dial-container">
            <div class="vertical-dial" id="vertical-dial">
                <!-- Numbers generated by JS -->
            </div>
        </div>
    </main>

    <!-- Removed Footer -->

    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        // Dial initialization only
        const dial = document.getElementById('vertical-dial');
        for (let i = 59; i >= 0; i--) {
            const div = document.createElement('div');
            div.className = 'dial-num';
            div.innerText = i.toString().padStart(2, '0');
            div.id = `dial-${i}`;
            dial.appendChild(div);
        }

        // 2. Countdown Logic
        const targetDate = new Date();
        targetDate.setDate(targetDate.getDate() + 54);
        targetDate.setHours(targetDate.getHours() + 8);

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = targetDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const mins = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const secs = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days.toString().padStart(2, '0');
            document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
            document.getElementById("mins").innerText = mins.toString().padStart(2, '0');
            document.getElementById("secs").innerText = secs.toString().padStart(2, '0');

            // Update Dial
            updateDial(secs);
        }

        function updateDial(currentSec) {
            // Find the active number and highlight it
            document.querySelectorAll('.dial-num').forEach(el => el.classList.remove('active'));
            const activeEl = document.getElementById(`dial-${currentSec}`);
            if (activeEl) {
                activeEl.classList.add('active');
                
                // Calculate scroll position to center the active number
                const dialHeight = document.getElementById('vertical-dial').offsetHeight;
                const itemHeight = activeEl.offsetHeight;
                const offset = activeEl.offsetTop - (window.innerHeight / 2) + (itemHeight / 2);
                
                // We use transform on the dial container for smooth movement
                const dialContainer = document.getElementById('vertical-dial');
                const translateVal = - (activeEl.offsetTop - (window.innerHeight / 2) + (itemHeight / 2));
                dialContainer.style.transform = `translateY(${translateVal}px)`;
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
